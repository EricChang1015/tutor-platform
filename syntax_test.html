<!DOCTYPE html>
<html>
<head>
    <title>Syntax Test</title>
</head>
<body>
    <h1>Testing JavaScript Syntax</h1>
    <div id="result"></div>
    
    <script>
        // Test testAPI.html
        fetch('/testAPI.html')
            .then(response => response.text())
            .then(html => {
                try {
                    // Extract script content
                    const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
                    if (scriptMatch) {
                        const scriptContent = scriptMatch[1];
                        // Try to evaluate the script
                        eval(scriptContent);
                        document.getElementById('result').innerHTML += '<p style="color: green;">testAPI.html: No syntax errors detected</p>';
                    }
                } catch (error) {
                    document.getElementById('result').innerHTML += '<p style="color: red;">testAPI.html Error: ' + error.message + '</p>';
                    console.error('testAPI.html syntax error:', error);
                }
            });
            
        // Test demo.html
        fetch('/demo.html')
            .then(response => response.text())
            .then(html => {
                try {
                    // Extract script content
                    const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
                    if (scriptMatch) {
                        const scriptContent = scriptMatch[1];
                        // Try to evaluate the script
                        eval(scriptContent);
                        document.getElementById('result').innerHTML += '<p style="color: green;">demo.html: No syntax errors detected</p>';
                    }
                } catch (error) {
                    document.getElementById('result').innerHTML += '<p style="color: red;">demo.html Error: ' + error.message + '</p>';
                    console.error('demo.html syntax error:', error);
                }
            });
    </script>
</body>
</html>
